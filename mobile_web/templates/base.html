<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Einkaufsliste">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <title>{% block title %}Einkaufsliste{% endblock %} - ZelaKüche</title>
  <style>
    :root {
      color-scheme: light dark;
      --grün: #1f6f4a;
      --grün-hell: #e7f4ee;
      --rand: #d9dee0;
      --text-schwach: #6b7280;
      --bg: #f7f8f7;
      --karte-bg: #fff;
      --text: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grün-hell: #17352a;
        --rand: #2a3236;
        --bg: #14181a;
        --karte-bg: #1e2427;
        --text: #eaeaea;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--grün);
      color: #fff;
      padding: 0.9rem 1rem 0.9rem 1rem;
      padding-top: max(0.9rem, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    header a { color: #fff; text-decoration: none; font-size: 0.85rem; opacity: 0.9; }
    main { padding: 1rem; max-width: 640px; margin: 0 auto; }
    .karte {
      background: var(--karte-bg);
      border: 1px solid var(--rand);
      border-radius: 12px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div id="offline-banner" style="display:none; position:sticky; top:0; z-index:20; padding:0.5rem 1rem; background:#fff3cd; color:#7a5b00; font-size:0.8rem; text-align:center;"></div>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='offline.js') }}"></script>
</body>
</html>
